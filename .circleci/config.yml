version: 2
jobs:
  build:
    docker:
      - image: cimg/go:1.25
    working_directory: /go/src/github.com/ropnop/kerbrute
    steps:
      - checkout
      - run: VERSION=${CIRCLE_TAG} make all
      - store_artifacts:
          path: ./dist

workflows:
  version: 2
  main:
    jobs:
      - build:
          filters:
            tags:
              only: /.*/